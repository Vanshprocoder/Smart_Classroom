name: Keep Render Warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API
        run: |
          curl --fail --silent --show-error \
            --max-time 120 \
            "${{ vars.RENDER_HEALTH_URL }}"
